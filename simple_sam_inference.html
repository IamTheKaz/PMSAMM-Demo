<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simple SAM Inference</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;padding:24px}
    .card{max-width:720px;margin:0 auto;background:#fff;padding:18px;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,0.06)}
    h1{font-size:18px;margin-bottom:8px}
    .row{display:flex;gap:8px;align-items:center}
    #preview{max-width:320px;max-height:240px;border:1px solid #ddd;padding:6px;border-radius:4px}
    button{padding:8px 12px;border-radius:6px;border:0;background:#0b63d6;color:#fff;cursor:pointer}
    button[disabled]{opacity:0.5;cursor:default}
    #results{margin-top:12px}
    .score{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid #f0f0f0}
    .muted{color:#666;font-size:13px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Simple SAM Inference</h1>
    <div class="muted">Upload an image, run the SAM Lambda through a local proxy, and see confidence per defect type.</div>

    <div style="margin-top:12px">
      <input id="file" type="file" accept="image/*">
    </div>

    <div style="margin-top:12px;display:flex;gap:12px;align-items:flex-start">
      <img id="preview" src="" alt="preview" />
      <div style="flex:1">
        <div style="margin-bottom:8px"><strong>Image:</strong> <span id="img-name" class="muted">none</span></div>
        <div class="row">
          <button id="runBtn" disabled>Run Model</button>
          <button id="clearBtn">Clear</button>
        </div>
        <div id="status" style="margin-top:8px" class="muted"></div>
      </div>
    </div>

    <div id="results"></div>
  </div>

  <script>
    // Use the local proxy server at /infer instead of calling AWS directly.
    const SAM_URL = '/infer';

    const fileEl = document.getElementById('file');
    const preview = document.getElementById('preview');
    const imgName = document.getElementById('img-name');
    const runBtn = document.getElementById('runBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    let dataUrl = null;

    fileEl.addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      if(!f) return clear();
      imgName.textContent = f.name;
      const r = new FileReader();
      r.onload = () => {
        dataUrl = r.result;
        preview.src = dataUrl;
        runBtn.disabled = false;
        resultsEl.innerHTML = '';
        statusEl.textContent = '';
      };
      r.readAsDataURL(f);
    });

    clearBtn.addEventListener('click', clear);
    function clear(){ fileEl.value=''; dataUrl=null; preview.src=''; imgName.textContent='none'; runBtn.disabled=true; resultsEl.innerHTML=''; statusEl.textContent=''; }

    runBtn.addEventListener('click', runInference);

    async function runInference(){
      if(!dataUrl) return;
      runBtn.disabled = true;
      statusEl.textContent = 'Sending image to SAM Lambda...';
      resultsEl.innerHTML = '';

      try{
        const resp = await fetch(SAM_URL, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ image: dataUrl })
        });
        const json = await resp.json();
        const body = (json && json.body) ? (typeof json.body === 'string' ? JSON.parse(json.body) : json.body) : json;

        // Expected structure: { label, confidence, raw_scores }
        if(body && (body.raw_scores || body.scores || body.predictions)){
          const map = body.raw_scores || body.scores || body.predictions;
          showScores(normalizeScores(map));
        } else if(body && body.label && (body.confidence!==undefined)){
          showScores({ [body.label]: Number(body.confidence) });
        } else {
          // Fallback: show raw body
          resultsEl.innerHTML = '<pre style="white-space:pre-wrap;">'+JSON.stringify(body, null, 2)+'</pre>';
        }
        statusEl.textContent = 'Inference complete.';
      }catch(err){
        statusEl.textContent = 'Error: '+err.message;
        resultsEl.innerHTML = '';
      } finally { runBtn.disabled = false; }
    }

    function normalizeScores(map){
      // Accepts objects like {class:score} or arrays [{label,score}]
      let out = {};
      if(Array.isArray(map)){
        map.forEach(item=>{
          if(item.label||item.name) out[item.label||item.name] = Number(item.confidence||item.score||item.prob||0);
        });
      } else if(typeof map === 'object'){
        for(const k of Object.keys(map)){
          let v = map[k];
          // if nested object with score field
          if(typeof v === 'object' && (v.score||v.confidence||v.prob)) v = v.score||v.confidence||v.prob;
          out[k] = Number(v);
        }
      }
      return out;
    }

    function showScores(obj){
      // obj: {label:confidence}
      const entries = Object.entries(obj).map(([k,v])=>[k,Number(v)]).sort((a,b)=>b[1]-a[1]);
      if(entries.length===0){ resultsEl.innerHTML = '<div class="muted">No scores returned.</div>'; return; }
      const total = entries.reduce((s,[_k,v])=>s + (isNaN(v)?0:v),0);
      let html = '<div style="margin-top:12px"><strong>Model scores</strong></div>';
      html += entries.map(([k,v]) => {
        const pct = isNaN(v) ? 'N/A' : (v>1? v+'%' : (v*100).toFixed(1)+'%');
        return '<div class="score"><div>'+escapeHtml(k)+'</div><div>'+pct+'</div></div>'
      }).join('');
      resultsEl.innerHTML = html;
    }

    function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>
</body>
</html>
