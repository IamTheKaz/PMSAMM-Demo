<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local SAM Model Test</title>
  <style>
    body{font-family:system-ui, -apple-system, BlinkMacSystemFont, sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2f7;padding:24px}
    .card{width:min(720px,100%);background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(15,23,42,0.12);padding:24px}
    h1{margin:0 0 10px;font-size:24px}
    .meta{color:#475569;font-size:14px;line-height:1.6;margin-bottom:18px}
    .controls{display:grid;gap:12px;margin-bottom:18px}
    input[type=file]{padding:8px}
    button{border:none;padding:12px 18px;border-radius:10px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
    button:disabled{background:#94a3b8;cursor:default}
    .preview{display:grid;gap:12px;margin-top:10px}
    img{max-width:100%;border-radius:12px;border:1px solid #cbd5e1}
    .status{font-size:14px;color:#334155;margin-top:10px}
    .results{margin-top:18px;border-radius:12px;border:1px solid #cbd5e1;background:#f8fafc;padding:16px}
    .score{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid #e2e8f0}
    .score:last-child{border-bottom:none}
    .label{font-weight:600;color:#0f172a}
    .value{color:#334155}
    pre{margin:0;font-size:13px;white-space:pre-wrap;word-break:break-all;color:#334155}
    .warning{color:#b45309;background:#fffbeb;border:1px solid #facc15;padding:10px;border-radius:10px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Local SAM Model Test</h1>
    <div class="meta">Upload an image and run `sam_model.tflite` locally through the Python server at <code>/predict</code>. Start it with <code>python3 local_sam_server.py</code>, not <code>python3 -m http.server</code>.</div>

    <div class="controls">
      <input id="file" type="file" accept="image/*">
      <button id="runBtn" disabled>Run model</button>
    </div>

    <div class="preview" id="previewArea"></div>
    <div class="status" id="status">Choose an image to start.</div>
    <div class="results" id="results"></div>
    <div class="status" id="debug" style="font-size:12px;color:#64748b;margin-top:10px;"></div>
  </div>

  <script>
    const SERVER_URL = 'http://127.0.0.1:8000';
    let selectedImage = null;
    const fileInput = document.getElementById('file');
    const runBtn = document.getElementById('runBtn');
    const statusEl = document.getElementById('status');
    const debugEl = document.getElementById('debug');
    const resultsEl = document.getElementById('results');
    const previewArea = document.getElementById('previewArea');

    async function checkServer() {
      try {
        const resp = await fetch(SERVER_URL + '/__ping__');
        if (!resp.ok) throw new Error('Server ping failed');
        const data = await resp.json();
        if (data.server !== 'local_sam_server') throw new Error('Wrong server response');
        statusEl.textContent = 'Local server is running and ready.';
        debugEl.textContent = 'Server verified at ' + SERVER_URL;
        runBtn.disabled = false;
      } catch (err) {
        statusEl.innerHTML = '<div class="warning">Cannot reach the local server at ' + SERVER_URL + '. Start it with <code>python3 local_sam_server.py</code>.</div>';
        debugEl.innerHTML = 'Server check failed: <pre>' + escapeHtml(err.toString()) + '</pre>';
        runBtn.disabled = true;
      }
    }

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      selectedImage = file;
      const url = URL.createObjectURL(file);
      previewArea.innerHTML = '<img src="' + url + '" alt="Uploaded image">';
      resultsEl.innerHTML = '';
      runBtn.disabled = false;
      statusEl.textContent = 'Image ready. Click Run model.';
      debugEl.textContent = 'Local server endpoint: /predict';
    });

    async function sendPrediction(file) {
      const formData = new FormData();
      formData.append('image', file);
      const resp = await fetch(SERVER_URL + '/predict', {method: 'POST', body: formData});
      if (!resp.ok) {
        const body = await resp.text();
        throw new Error('Prediction failed: ' + resp.status + ' ' + resp.statusText + '\n' + body);
      }
      return resp.json();
    }

    window.addEventListener('load', () => {
      runBtn.disabled = true;
      statusEl.textContent = 'Checking local server...';
      checkServer();
    });

    runBtn.addEventListener('click', async () => {
      if (!selectedImage) {
        statusEl.textContent = 'Please choose an image first.';
        return;
      }
      runBtn.disabled = true;
      statusEl.textContent = 'Sending image to local server...';
      debugEl.textContent = 'Uploading image to /predict';
      try {
        const data = await sendPrediction(selectedImage);
        displayResults(data);
        statusEl.textContent = 'Inference complete.';
        debugEl.textContent = 'Prediction returned from local server.';
      } catch (err) {
        statusEl.innerHTML = '<div class="warning">Inference failed. Make sure the local server is running.</div>';
        debugEl.innerHTML = 'Error: <pre>' + escapeHtml(err.toString()) + '</pre>';
      } finally {
        runBtn.disabled = false;
      }
    });

    function displayResults(data) {
      if (data.error) {
        throw new Error(data.error);
      }
      const entries = Object.entries(data.raw_scores).map(([label, score]) => ({label, score: Number(score)}));
      entries.sort((a, b) => b.score - a.score);
      resultsEl.innerHTML = entries.map(entry =>
        '<div class="score"><div class="label">' + escapeHtml(entry.label) + '</div><div class="value">' + entry.score.toFixed(1) + '%</div></div>'
      ).join('');
      resultsEl.innerHTML = '<div style="margin-bottom:12px;font-weight:700;color:#0f172a;">Top prediction: ' + escapeHtml(data.label) + ' (' + Number(data.confidence).toFixed(1) + '%)</div>' + resultsEl.innerHTML;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
