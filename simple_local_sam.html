<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local SAM TFLite Test</title>
  <style>
    body{font-family:system-ui, -apple-system, BlinkMacSystemFont, sans-serif; margin:0; min-height:100vh; display:grid; place-items:center; background:#eef2f7; padding:24px}
    .card{width:min(720px,100%);background:#ffffff;border-radius:16px;box-shadow:0 18px 50px rgba(15,23,42,0.12);padding:24px;}
    h1{margin:0 0 10px;font-size:24px}
    .meta{color:#475569;font-size:14px;line-height:1.6;margin-bottom:18px}
    .controls{display:grid;gap:12px;margin-bottom:18px}
    input[type=file]{padding:8px}
    button{border:none;padding:12px 18px;border-radius:10px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
    button:disabled{background:#94a3b8;cursor:default}
    .preview{display:grid;gap:12px;margin-top:10px}
    img{max-width:100%;border-radius:12px;border:1px solid #cbd5e1}
    .status{font-size:14px;color:#334155;margin-top:10px}
    .results{margin-top:18px;border-radius:12px;border:1px solid #cbd5e1;background:#f8fafc;padding:16px}
    .score{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid #e2e8f0}
    .score:last-child{border-bottom:none}
    .label{font-weight:600;color:#0f172a}
    .value{color:#334155}
    pre{margin:0;font-size:13px;white-space:pre-wrap;word-break:break-all;color:#334155}
    .warning{color:#b45309;background:#fffbeb;border:1px solid #facc15;padding:10px;border-radius:10px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite/dist/tf-tflite.min.js"></script>
</head>
<body>
  <div class="card">
    <h1>Local SAM TFLite Test</h1>
    <div class="meta">Load `sam_model.tflite` from this folder and upload a picture to see per-class confidence scores in your browser. No AWS needed.</div>

    <div class="controls">
      <input id="file" type="file" accept="image/*">
      <button id="runBtn" disabled>Run model</button>
    </div>

    <div class="preview" id="previewArea"></div>
    <div class="status" id="status">Model not loaded yet.</div>
    <div class="results" id="results"></div>
    <div class="status" id="debug" style="font-size:12px;color:#64748b;margin-top:10px;"></div>
  </div>

  <script>
    const MODEL_URL = new URL('sam_model.tflite', window.location.href).href;
    const CLASS_LABELS = ['none', 'underextrusion', 'stringing', 'spaghetti'];
    const IMAGE_SIZE = 224;
    let model = null;
    let selectedImage = null;

    const fileInput = document.getElementById('file');
    const runBtn = document.getElementById('runBtn');
    const statusEl = document.getElementById('status');
    const debugEl = document.getElementById('debug');
    const resultsEl = document.getElementById('results');
    const previewArea = document.getElementById('previewArea');

    async function init() {
      if (window.location.protocol === 'file:') {
        statusEl.innerHTML = '<div class="warning">This page must be opened via a local web server, not as a file:// URL. Run <code>python3 -m http.server 8000</code> in the folder and open <code>http://localhost:8000/simple_local_sam.html</code>.</div>';
        debugEl.textContent = 'Current protocol: ' + window.location.protocol;
        return;
      }

      statusEl.textContent = 'Loading local TFLite model...';
      debugEl.textContent = 'Model URL: ' + MODEL_URL;
      try {
        if (typeof tflite === 'undefined' || !tflite.loadTFLiteModel) {
          throw new Error('TensorFlow Lite runtime not available. Check that the tfjs and tfjs-tflite scripts loaded correctly.');
        }

        const response = await fetch(MODEL_URL, {method: 'HEAD'});
        if (!response.ok) {
          throw new Error('Model file not found at ' + MODEL_URL + ' (HTTP ' + response.status + ')');
        }

        model = await tflite.loadTFLiteModel(MODEL_URL);
        statusEl.textContent = 'Model loaded. Choose an image to test.';
        debugEl.textContent = 'TensorFlow Lite model loaded successfully.';
      } catch (err) {
        statusEl.innerHTML = '<div class="warning">Failed to load model. Make sure <code>sam_model.tflite</code> is in the same folder and that you are serving this page from a local server.</div>';
        debugEl.innerHTML = 'Error: <pre>' + escapeHtml(err.toString()) + '</pre>';
      }
    }

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      selectedImage = file;
      const url = URL.createObjectURL(file);
      previewArea.innerHTML = '<img id="previewImage" src="' + url + '" alt="Uploaded image">';
      resultsEl.innerHTML = '';
      runBtn.disabled = false;
      statusEl.textContent = 'Image ready. Click Run model.';
    });

    async function sendPrediction(file) {
      const formData = new FormData();
      formData.append('image', file);
      const resp = await fetch('/predict', {method: 'POST', body: formData});
      if (!resp.ok) throw new Error('Prediction failed: ' + resp.status + ' ' + resp.statusText);
      return resp.json();
    }

    runBtn.addEventListener('click', async () => {
      if (!selectedImage) {
        statusEl.textContent = 'Please choose an image first.';
        return;
      }
      runBtn.disabled = true;
      statusEl.textContent = 'Sending image to local server...';
      debugEl.textContent = 'Uploading image to /predict';
      try {
        const data = await sendPrediction(selectedImage);
        displayResultsFromServer(data);
        statusEl.textContent = 'Inference complete.';
        debugEl.textContent = 'Prediction returned from local server.';
      } catch (err) {
        statusEl.innerHTML = '<div class="warning">Inference failed. Make sure the local server is running.</div>';
        debugEl.innerHTML = 'Error: <pre>' + escapeHtml(err.toString()) + '</pre>';
      } finally {
        runBtn.disabled = false;
      }
    });

    function displayResultsFromServer(data) {
      if (data.error) {
        throw new Error(data.error);
      }
      const entries = Object.entries(data.raw_scores).map(([label, score]) => ({label, score: Number(score)}));
      entries.sort((a,b) => b.score - a.score);
      resultsEl.innerHTML = entries.map(entry =>
        '<div class="score"><div class="label">' + escapeHtml(entry.label) + '</div><div class="value">' + entry.score.toFixed(1) + '%</div></div>'
      ).join('');
      const best = entries[0];
      resultsEl.innerHTML = '<div style="margin-bottom:12px;font-weight:700;color:#0f172a;">Top prediction: ' + escapeHtml(data.label) + ' (' + Number(data.confidence).toFixed(1) + '%)</div>' + resultsEl.innerHTML;
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    function displayResults(scores) {
      const entries = CLASS_LABELS.map((label, index) => ({label, score: scores[index] || 0}));
      entries.sort((a,b) => b.score - a.score);
      resultsEl.innerHTML = entries.map((entry, i) =>
        '<div class="score"><div class="label">' + escapeHtml(entry.label) + '</div><div class="value">' + entry.score.toFixed(1) + '%</div></div>'
      ).join('');
      const best = entries[0];
      resultsEl.innerHTML = '<div style="margin-bottom:12px;font-weight:700;color:#0f172a;">Top prediction: ' + escapeHtml(best.label) + ' (' + best.score.toFixed(1) + '%)</div>' + resultsEl.innerHTML;
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    init();
  </script>
</body>
</html>
